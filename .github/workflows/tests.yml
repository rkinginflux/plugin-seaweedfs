name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and local HTTP/TLS tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compile plugin
        run: python -m py_compile seaweedfs_inventory.py
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint documentation
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"
